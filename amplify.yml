version: 1
# The Lambda API is TypeScript, deployed natively via Amplify Gen 2's `defineFunction` — no
# Docker, no ECR, no Maven/JVM here. See CLAUDE.md "Amplify Gen 2 backend" for the architecture.
backend:
  phases:
    build:
      commands:
        - (cd ui && npm install)
        - (cd ui && npx ampx pipeline-deploy --branch "$AWS_BRANCH" --app-id "$AWS_APP_ID")
frontend:
  phases:
    preBuild:
      commands:
        # Maven needs a JVM to run the openapi-generator + frontend-maven-plugin
        # steps that produce the @orgasm/backend-client package ui/ depends on
        # (file:../sdk-typescript/target/typescript-client). sdk-typescript has no
        # hand-written Java, so any modern JDK works here regardless of the
        # project's Java 25 target.
        - sudo dnf install -y java-21-amazon-corretto-headless
        - ./mvnw --batch-mode --no-transfer-progress install -pl sdk-typescript -am -DskipTests
        # Amplify runs phase commands in a persistent shell (cwd carries over
        # between commands and phases), so `cd ui` here would otherwise leave
        # later commands looking for a nested ui/ui. Scope it to a subshell.
        - (cd ui && npm install)
    build:
      commands:
        # Phase 1: self-contained mock-data build (MSW), no backend/Keycloak required.
        # Drop VITE_MOCK once the UI is wired to call the Lambda API for real (see
        # CLAUDE.md "Cognito auth for the Lambda API" — deliberately not done yet).
        # ui/amplify_outputs.json was just overwritten by the backend phase's
        # ampx pipeline-deploy with this branch's real Cognito/Function URL values.
        - (cd ui && VITE_MOCK=true npm run build)
  artifacts:
    baseDirectory: ui/dist
    files:
      - '**/*'
  cache:
    paths:
      - $HOME/.m2/**/*
      - sdk-typescript/target/typescript-client/node_modules/**/*
      - ui/node_modules/**/*
