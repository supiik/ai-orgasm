spring:
  application:
    name: proxima-service-lambda
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

datasource:
  app:
    url: ${DATASOURCE_APP_URL:jdbc:mariadb://localhost:3306/proxima_service}
    username: ${DATASOURCE_APP_USERNAME:proxima_service}
    password: ${DATASOURCE_APP_PASSWORD:proxima_service}
    driver-class-name: org.mariadb.jdbc.Driver
  billing:
    url: ${DATASOURCE_BILLING_URL:jdbc:mariadb://localhost:3307/proxima_service_billing}
    username: ${DATASOURCE_BILLING_USERNAME:proxima_service_billing}
    password: ${DATASOURCE_BILLING_PASSWORD:proxima_service_billing}
    driver-class-name: org.mariadb.jdbc.Driver
  flyway:
    enabled: false

resilience4j:
  circuitbreaker:
    instances:
      db:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - org.springframework.dao.DataAccessException
          - java.sql.SQLException

logging:
  level:
    com.etactics.proxima.service: INFO
