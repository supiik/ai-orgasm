spring:
  application:
    name: orgasm-lambda

app:
  dynamodb:
    table-playlists: ${DYNAMODB_TABLE_PLAYLISTS:orgasm-playlists-local}
    endpoint-override: ${DYNAMODB_ENDPOINT_OVERRIDE:}

resilience4j:
  circuitbreaker:
    instances:
      db:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - software.amazon.awssdk.services.dynamodb.model.DynamoDbException

logging:
  level:
    com.orgasm: INFO
