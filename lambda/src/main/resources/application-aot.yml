spring:
  jpa:
    hibernate:
      ddl-auto: none

datasource:
  app:
    url: jdbc:h2:mem:proxima_sal_app;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    username: sa
    password:
    driver-class-name: org.h2.Driver
  billing:
    url: jdbc:h2:mem:proxima_sal_billing;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
