    Properties:
      FunctionName: !Sub "orgasm-start-guessing-${Env}"
      Description: Close nominations and start the guessing phase
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - com.orgasm.lambda.StartGuessingHandler::handleRequest
      Policies:
