      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SongsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ContributorsTable
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: ["*"]
          AllowMethods: [POST]
          AllowHeaders: [content-type, authorization]

  GetSongFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "orgasm-get-song-${Env}"
      Description: Get a song by id
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - com.orgasm.lambda.GetSongHandler::handleRequest
      Policies:
        - DynamoDBCrudPolicy:
