      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SongsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ContributorsTable
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: ["*"]
          AllowMethods: [PUT]
          AllowHeaders: [content-type, authorization]

  DeleteSongFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "orgasm-delete-song-${Env}"
      Description: Delete (soft) a song
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - com.orgasm.lambda.DeleteSongHandler::handleRequest
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SongsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ContributorsTable
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: ["*"]
          AllowMethods: [DELETE]
          AllowHeaders: [authorization]

  CreateContributorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "orgasm-create-contributor-${Env}"
      Description: Create a contributor
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - com.orgasm.lambda.CreateContributorHandler::handleRequest
      Policies:
        - DynamoDBCrudPolicy:
