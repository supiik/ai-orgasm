AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: Orgasm Lambda functions (SAM) — container image deployment

Globals:
  Function:
    Architectures:
      - arm64
    MemorySize: 512
    Timeout: 30
    PackageType: Image
    Environment:
      Variables:
        DYNAMODB_TABLE_PLAYLISTS: !Ref PlaylistsTable

Parameters:
  Env:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  ImageUri:
    Type: String
    Description: >
      ECR image URI built from lambda/Dockerfile.
      Example: 123456789012.dkr.ecr.us-east-1.amazonaws.com/orgasm-lambda:latest

Resources:
  PlaylistsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "orgasm-playlists-${Env}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  HelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "orgasm-hello-${Env}"
      Description: Health-check / hello endpoint
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - com.orgasm.lambda.HelloHandler::handleRequest
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PlaylistsTable
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - "*"
          AllowMethods:
            - GET

  CreatePlaylistFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "orgasm-create-playlist-${Env}"
      Description: Create a playlist
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - com.orgasm.lambda.CreatePlaylistHandler::handleRequest
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PlaylistsTable
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - "*"
          AllowMethods:
            - POST
          AllowHeaders:
            - content-type

Outputs:
  HelloFunctionUrl:
    Description: Hello Function URL
    Value: !GetAtt HelloFunctionUrl.FunctionUrl

  CreatePlaylistFunctionUrl:
    Description: Create Playlist Function URL
    Value: !GetAtt CreatePlaylistFunctionUrl.FunctionUrl
