  SubmitGuessesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "orgasm-submit-guesses-${Env}"
      Description: Submit (replace) a contributor's guesses for a playlist
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - com.orgasm.lambda.SubmitGuessesHandler::handleRequest
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PlaylistsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ContributorsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NominationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GuessesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GuessSubmissionsTable
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: ["*"]
          AllowMethods: [POST]
          AllowHeaders: [content-type, authorization]

  ListGuessesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "orgasm-list-guesses-${Env}"
      Description: List guesses for a playlist
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - com.orgasm.lambda.ListGuessesHandler::handleRequest
