        - DynamoDBCrudPolicy:
            TableName: !Ref ContributorsTable
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: ["*"]
          AllowMethods: [GET]
          AllowHeaders: [authorization]

  ListSongNominationsFunction:
