          AllowHeaders: [content-type, authorization]

  DeleteContributorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "orgasm-delete-contributor-${Env}"
      Description: Delete (soft) a contributor
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - com.orgasm.lambda.DeleteContributorHandler::handleRequest
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ContributorsTable
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: ["*"]
          AllowMethods: [DELETE]
          AllowHeaders: [authorization]

  ListOrganizationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "orgasm-list-organizations-${Env}"
      Description: List organizations (public, no auth)
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - com.orgasm.lambda.ListOrganizationsHandler::handleRequest
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OrganizationsTable
      FunctionUrlConfig:
        AuthType: NONE
