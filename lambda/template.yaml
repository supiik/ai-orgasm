AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: Orgasm Lambda functions (SAM)

Globals:
  Function:
    Runtime: java25
    Architectures:
      - arm64
    MemorySize: 512
    Timeout: 30
    Environment:
      Variables:
        JAVA_TOOL_OPTIONS: -XX:+TieredCompilation -XX:TieredStopAtLevel=1

Resources:
  HelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: orgasm-hello
      Handler: com.orgasm.lambda.HelloHandler::handleRequest
      CodeUri: target/orgasm-lambda-1.0.0-SNAPSHOT.jar
      Description: Sample Hello Lambda
      Events:
        HelloApi:
          Type: HttpApi
          Properties:
            Path: /hello
            Method: GET

Outputs:
  HelloApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/hello"
