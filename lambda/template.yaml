AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: Orgasm Lambda functions (SAM) — container image deployment

Globals:
  Function:
    Architectures:
      - arm64
    MemorySize: 512
    Timeout: 30
    PackageType: Image
    Environment:
      Variables:
        DYNAMODB_TABLE_PLAYLISTS: !Ref PlaylistsTable
        DYNAMODB_TABLE_SONGS: !Ref SongsTable
        DYNAMODB_TABLE_CONTRIBUTORS: !Ref ContributorsTable
        DYNAMODB_TABLE_ORGANIZATIONS: !Ref OrganizationsTable
        DYNAMODB_TABLE_NOMINATIONS: !Ref NominationsTable
        DYNAMODB_TABLE_GUESSES: !Ref GuessesTable
        DYNAMODB_TABLE_GUESS_SUBMISSIONS: !Ref GuessSubmissionsTable
        DYNAMODB_TABLE_SONG_RATINGS: !Ref SongRatingsTable
        DYNAMODB_TABLE_PLAYLIST_RANKINGS: !Ref PlaylistRankingsTable
        COGNITO_USER_POOL_ID: !Ref UserPool
        COGNITO_REGION: !Ref AWS::Region
        COGNITO_CLIENT_ID: !Ref UserPoolClient

Parameters:
  Env:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  ImageUri:
    Type: String
    Description: >
      ECR image URI built from lambda/Dockerfile.
      Example: 123456789012.dkr.ecr.us-east-1.amazonaws.com/orgasm-lambda:latest

Resources:
  # ---------------------------------------------------------------------------
  # DynamoDB tables — one per entity type, PAY_PER_REQUEST (no idle cost).
  # ---------------------------------------------------------------------------

  PlaylistsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "orgasm-playlists-${Env}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  SongsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "orgasm-songs-${Env}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  ContributorsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "orgasm-contributors-${Env}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: cognitoSub
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: byCognitoSub
          KeySchema:
            - AttributeName: cognitoSub
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # ---------------------------------------------------------------------------
  # Cognito — identity provider for the Lambda API (independent of the traditional
  # backend's Keycloak, which stays unchanged). Public SPA client, no secret.
  # ---------------------------------------------------------------------------

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "orgasm-users-${Env}"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "orgasm-ui-${Env}"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # Not tenant-partitioned — this table IS the tenant directory (mirrors the separate,
  # multi-tenancy-free "billing" database the real backend keeps Organization in).
  OrganizationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "orgasm-organizations-${Env}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: N
        - AttributeName: slug
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: bySlug
          KeySchema:
            - AttributeName: slug
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  NominationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "orgasm-nominations-${Env}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: playlistId
          AttributeType: N
        - AttributeName: songId
          AttributeType: N
        - AttributeName: id
          AttributeType: N
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: byPlaylist
          KeySchema:
            - AttributeName: playlistId
              KeyType: HASH
            - AttributeName: songId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: bySong
          KeySchema:
            - AttributeName: songId
              KeyType: HASH
            - AttributeName: id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  GuessesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "orgasm-guesses-${Env}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: playlistId
          AttributeType: N
        - AttributeName: id
          AttributeType: N
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: byPlaylist
          KeySchema:
            - AttributeName: playlistId
              KeyType: HASH
            - AttributeName: id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  GuessSubmissionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "orgasm-guess-submissions-${Env}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: playlistId
          AttributeType: N
        - AttributeName: contributorId
          AttributeType: N
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: byPlaylist
          KeySchema:
            - AttributeName: playlistId
              KeyType: HASH
            - AttributeName: contributorId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  SongRatingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "orgasm-song-ratings-${Env}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: playlistId
          AttributeType: N
        - AttributeName: id
          AttributeType: N
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: byPlaylist
          KeySchema:
            - AttributeName: playlistId
              KeyType: HASH
            - AttributeName: id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  PlaylistRankingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "orgasm-playlist-rankings-${Env}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: playlistId
          AttributeType: N
        - AttributeName: rankPosition
          AttributeType: N
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: byPlaylist
          KeySchema:
            - AttributeName: playlistId
              KeyType: HASH
            - AttributeName: rankPosition
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ---------------------------------------------------------------------------
  # Functions — one per endpoint. Each Policies list is scoped to the tables that
  # handler's service dependencies actually read/write.
  # ---------------------------------------------------------------------------

  HelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "orgasm-hello-${Env}"
      Description: Health-check / hello endpoint
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - com.orgasm.lambda.HelloHandler::handleRequest
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PlaylistsTable
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: ["*"]
          AllowMethods: [GET]

  CreatePlaylistFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "orgasm-create-playlist-${Env}"
      Description: Create a playlist
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - com.orgasm.lambda.CreatePlaylistHandler::handleRequest
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PlaylistsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ContributorsTable
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: ["*"]
          AllowMethods: [POST]
          AllowHeaders: [content-type, authorization]

  GetPlaylistFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "orgasm-get-playlist-${Env}"
      Description: Get a playlist by id
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - com.orgasm.lambda.GetPlaylistHandler::handleRequest
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PlaylistsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ContributorsTable
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: ["*"]
          AllowMethods: [GET]
          AllowHeaders: [authorization]

  ListPlaylistsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "orgasm-list-playlists-${Env}"
      Description: List playlists
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - com.orgasm.lambda.ListPlaylistsHandler::handleRequest
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PlaylistsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ContributorsTable
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: ["*"]
          AllowMethods: [GET]
          AllowHeaders: [authorization]

  UpdatePlaylistFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "orgasm-update-playlist-${Env}"
      Description: Update a playlist
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - com.orgasm.lambda.UpdatePlaylistHandler::handleRequest
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PlaylistsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ContributorsTable
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: ["*"]
          AllowMethods: [PUT]
          AllowHeaders: [content-type, authorization]

  DeletePlaylistFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "orgasm-delete-playlist-${Env}"
      Description: Delete (soft) a playlist
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - com.orgasm.lambda.DeletePlaylistHandler::handleRequest
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PlaylistsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ContributorsTable
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: ["*"]
          AllowMethods: [DELETE]
          AllowHeaders: [authorization]

  CreateSongFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "orgasm-create-song-${Env}"
      Description: Create a song
