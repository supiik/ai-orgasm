      FunctionName: !Sub "orgasm-list-song-nominations-${Env}"
      Description: List nominations for a song, across playlists
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - com.orgasm.lambda.ListSongNominationsHandler::handleRequest
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NominationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PlaylistsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ContributorsTable
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: ["*"]
          AllowMethods: [GET]
          AllowHeaders: [authorization]

  ApproveNominationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "orgasm-approve-nomination-${Env}"
      Description: Approve a pending nomination
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - com.orgasm.lambda.ApproveNominationHandler::handleRequest
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NominationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PlaylistsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ContributorsTable
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: ["*"]
          AllowMethods: [PUT]
          AllowHeaders: [content-type, authorization]

  DeclineNominationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "orgasm-decline-nomination-${Env}"
      Description: Decline a pending nomination
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - com.orgasm.lambda.DeclineNominationHandler::handleRequest
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NominationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PlaylistsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ContributorsTable
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: ["*"]
          AllowMethods: [PUT]
          AllowHeaders: [content-type, authorization]

  StartGuessingFunction:
