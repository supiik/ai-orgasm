AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: Anchor Lambda functions (SAM) — container image deployment

Globals:
  Function:
    Architectures:
      - arm64
    MemorySize: 512
    Timeout: 30
    PackageType: Image
    Environment:
      Variables:
        DATASOURCE_APP_URL: !Sub "{{resolve:ssm:/anchor/${Env}/datasource/app/url}}"
        DATASOURCE_APP_USERNAME: !Sub "{{resolve:ssm:/anchor/${Env}/datasource/app/username}}"
        DATASOURCE_APP_PASSWORD: !Sub "{{resolve:ssm:/anchor/${Env}/datasource/app/password}}"
        DATASOURCE_BILLING_URL: !Sub "{{resolve:ssm:/anchor/${Env}/datasource/billing/url}}"
        DATASOURCE_BILLING_USERNAME: !Sub "{{resolve:ssm:/anchor/${Env}/datasource/billing/username}}"
        DATASOURCE_BILLING_PASSWORD: !Sub "{{resolve:ssm:/anchor/${Env}/datasource/billing/password}}"

Parameters:
  Env:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  ImageUri:
    Type: String
    Description: >
      ECR image URI built from lambda/Dockerfile.
      Example: 123456789012.dkr.ecr.us-east-1.amazonaws.com/anchor-lambda:latest

Resources:
  HelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "anchor-hello-${Env}"
      Description: Health-check / hello endpoint
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - com.pi2.anchor.lambda.HelloHandler::handleRequest
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - "*"
          AllowMethods:
            - GET

  CreateSampleFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "anchor-create-sample-${Env}"
      Description: Create a sample
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - com.pi2.anchor.lambda.CreateSampleHandler::handleRequest
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - "*"
          AllowMethods:
            - POST
          AllowHeaders:
            - content-type

Outputs:
  HelloFunctionUrl:
    Description: Hello Function URL
    Value: !GetAtt HelloFunctionUrl.FunctionUrl

  CreateSampleFunctionUrl:
    Description: Create Sample Function URL
    Value: !GetAtt CreateSampleFunctionUrl.FunctionUrl
