server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    # Proxy versioned API and legacy health endpoint to the backend.
    # The backend URL is set via the BACKEND_URL environment variable
    # (default: http://backend:8080 for Docker Compose).
    location /v1/ {
        proxy_pass         ${BACKEND_URL};
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass         ${BACKEND_URL};
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SPA routing — all non-file paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived cache for versioned static assets (Vite appends content hashes)
    location ~* \.(js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|ico|svg)$ {
        expires            1y;
        add_header         Cache-Control "public, immutable";
    }

    gzip            on;
    gzip_comp_level 5;
    gzip_types      text/plain text/css application/json
                    application/javascript text/javascript
                    application/xml+rss image/svg+xml;
}
