services:
  mariadb-app:
    image: mariadb:12.2.2
    environment:
      MARIADB_DATABASE: ${APP_DB_NAME}
      MARIADB_USER: ${APP_DB_USER}
      MARIADB_PASSWORD: ${APP_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${APP_DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_app_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  mariadb-billing:
    image: mariadb:12.2.2
    environment:
      MARIADB_DATABASE: ${BILLING_DB_NAME}
      MARIADB_USER: ${BILLING_DB_USER}
      MARIADB_PASSWORD: ${BILLING_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${BILLING_DB_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mariadb_billing_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.3-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI → http://localhost:8025
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    ports:
      - "8180:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/realms/orgasm/.well-known/openid-configuration >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  mariadb_app_data:
  mariadb_billing_data:
