services:
  mariadb:
    image: mariadb:12.2.2
    environment:
      MARIADB_DATABASE: orgasm
      MARIADB_USER: orgasm
      MARIADB_PASSWORD: orgasm
      MARIADB_ROOT_PASSWORD: orgasm_root
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mariadb_data:
