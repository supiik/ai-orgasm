services:
  mariadb-app:
    image: mariadb:12.2.2
    environment:
      MARIADB_DATABASE: orgasm
      MARIADB_USER: orgasm
      MARIADB_PASSWORD: orgasm
      MARIADB_ROOT_PASSWORD: orgasm_root
    ports:
      - "3306:3306"
    volumes:
      - mariadb_app_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  mariadb-billing:
    image: mariadb:12.2.2
    environment:
      MARIADB_DATABASE: orgasm_billing
      MARIADB_USER: orgasm_billing
      MARIADB_PASSWORD: orgasm_billing
      MARIADB_ROOT_PASSWORD: orgasm_billing_root
    ports:
      - "3307:3306"
    volumes:
      - mariadb_billing_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.3-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mariadb_app_data:
  mariadb_billing_data:
