datasource:
  app:
    url: jdbc:h2:mem:proxima_service_app;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    username: sa
    password:
    driver-class-name: org.h2.Driver
  billing:
    url: jdbc:h2:mem:proxima_service_billing;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false

spring:
  jpa:
    hibernate:
      ddl-auto: none
  docker:
    compose:
      enabled: false
  cache:
    type: simple
  mail:
    host: localhost
    port: 1025
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ""
          jwk-set-uri: http://localhost:8180/realms/proxima-service/protocol/openid-connect/certs

app:
  mail:
    from: noreply@test.local
  id:
    secret: "0000000000000000"
