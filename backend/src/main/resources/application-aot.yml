spring:
  docker:
    compose:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: none
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ""
          jwk-set-uri: http://localhost:8180/realms/proxima-sal/protocol/openid-connect/certs

datasource:
  app:
    url: jdbc:h2:mem:proxima_sal_app;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    username: sa
    password:
    driver-class-name: org.h2.Driver
  billing:
    url: jdbc:h2:mem:proxima_sal_billing;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false

spring.data.redis.host: localhost
spring.cache.type: none
