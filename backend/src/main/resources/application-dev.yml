spring:
  docker:
    compose:
      lifecycle-management: start-only
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  # Human-readable pattern layout locally; trace/span ids still appear via Boot's correlation pattern.
  structured:
    format:
      console: ${LOG_FORMAT:}
  level:
    com.orgasm: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
