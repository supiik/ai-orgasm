spring:
  application:
    name: orgasm-backend
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KC_ISSUER_URI:http://localhost:8180/realms/orgasm}
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
  docker:
    compose:
      lifecycle-management: start-and-stop
      file: compose.yml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
    redis:
      time-to-live: 10m
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

app:
  mail:
    from: ${MAIL_FROM:noreply@orgasm.local}
  id:
    secret: ${ID_SECRET:0000000000000000}

datasource:
  app:
    url: jdbc:mariadb://localhost:3306/orgasm
    username: orgasm
    password: orgasm
    driver-class-name: org.mariadb.jdbc.Driver
  billing:
    url: jdbc:mariadb://localhost:3307/orgasm_billing
    username: orgasm_billing
    password: orgasm_billing
    driver-class-name: org.mariadb.jdbc.Driver

server:
  port: 8080
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

resilience4j:
  circuitbreaker:
    instances:
      db:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - org.springframework.dao.DataAccessException
          - java.sql.SQLException

logging:
  level:
    com.orgasm: DEBUG
    org.springframework.web: INFO
