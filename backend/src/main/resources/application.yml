spring:
  application:
    name: orgasm-backend
  datasource:
    url: jdbc:mariadb://localhost:3306/orgasm
    username: orgasm
    password: orgasm
    driver-class-name: org.mariadb.jdbc.Driver
  docker:
    compose:
      lifecycle-management: start-and-stop
      file: compose.yml
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.orgasm: DEBUG
    org.springframework.web: INFO
