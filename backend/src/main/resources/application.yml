spring:
  application:
    name: orgasm-backend
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
  docker:
    compose:
      lifecycle-management: start-and-stop
      file: compose.yml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
    redis:
      time-to-live: 10m

datasource:
  app:
    url: jdbc:mariadb://localhost:3306/orgasm
    username: orgasm
    password: orgasm
    driver-class-name: org.mariadb.jdbc.Driver
  billing:
    url: jdbc:mariadb://localhost:3307/orgasm_billing
    username: orgasm_billing
    password: orgasm_billing
    driver-class-name: org.mariadb.jdbc.Driver

server:
  port: 8080
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

resilience4j:
  circuitbreaker:
    instances:
      db:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - org.springframework.dao.DataAccessException
          - java.sql.SQLException

logging:
  level:
    com.orgasm: DEBUG
    org.springframework.web: INFO
