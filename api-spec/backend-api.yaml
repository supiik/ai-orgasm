openapi: 3.0.3
info:
  title: Orgasm Backend API
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: contributors
  - name: playlists
  - name: songs
  - name: health

paths:
  /api/v1/contributors:
    get:
      tags: [contributors]
      operationId: findAllContributors
      summary: List contributors (paginated)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          schema:
            type: string
            default: id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContributorPage'
    post:
      tags: [contributors]
      operationId: createContributor
      summary: Create a contributor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContributorRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContributorResponse'
        '400':
          description: Validation error

  /api/v1/contributors/{id}:
    get:
      tags: [contributors]
      operationId: findContributorById
      summary: Get a contributor by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContributorResponse'
        '404':
          description: Not found
    put:
      tags: [contributors]
      operationId: updateContributor
      summary: Update a contributor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContributorRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContributorResponse'
        '400':
          description: Validation error
        '404':
          description: Not found
    delete:
      tags: [contributors]
      operationId: deleteContributor
      summary: Delete a contributor (soft delete)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: No content
        '404':
          description: Not found

  /api/v1/songs:
    get:
      tags: [songs]
      operationId: findAllSongs
      summary: List songs (paginated)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          schema:
            type: string
            default: id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SongPage'
    post:
      tags: [songs]
      operationId: createSong
      summary: Create a song
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSongRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SongResponse'
        '400':
          description: Validation error

  /api/v1/songs/{id}:
    get:
      tags: [songs]
      operationId: findSongById
      summary: Get a song by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SongResponse'
        '404':
          description: Not found
    put:
      tags: [songs]
      operationId: updateSong
      summary: Update a song
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSongRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SongResponse'
        '400':
          description: Validation error
        '404':
          description: Not found
    delete:
      tags: [songs]
      operationId: deleteSong
      summary: Delete a song (soft delete)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: No content
        '404':
          description: Not found

  /api/health:
    get:
      tags: [health]
      operationId: health
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/playlists:
    get:
      tags: [playlists]
      operationId: findAllPlaylists
      summary: List playlists (paginated)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          schema:
            type: string
            default: id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistPage'
    post:
      tags: [playlists]
      operationId: createPlaylist
      summary: Create a playlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlaylistRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistResponse'
        '400':
          description: Validation error

  /api/v1/playlists/{id}:
    get:
      tags: [playlists]
      operationId: findPlaylistById
      summary: Get a playlist by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistResponse'
        '404':
          description: Not found
    put:
      tags: [playlists]
      operationId: updatePlaylist
      summary: Update a playlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlaylistRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistResponse'
        '400':
          description: Validation error
        '404':
          description: Not found
    delete:
      tags: [playlists]
      operationId: deletePlaylist
      summary: Delete a playlist (soft delete)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: No content
        '404':
          description: Not found

components:
  schemas:
    CreateContributorRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string

    UpdateContributorRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string

    ContributorResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ContributorPage:
      type: object
      description: Spring Page response for contributors. Unknown Spring Page fields are ignored on deserialization.
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ContributorResponse'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        number:
          type: integer
          description: Current page number (0-based)
        size:
          type: integer

    PlaylistStatus:
      type: string
      enum: [NEW, OPEN, UNDER_EVALUATION, CLOSED]

    CreatePlaylistRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        status:
          $ref: '#/components/schemas/PlaylistStatus'

    UpdatePlaylistRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        status:
          $ref: '#/components/schemas/PlaylistStatus'

    PlaylistResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/PlaylistStatus'
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PlaylistPage:
      type: object
      description: Spring Page response for playlists. Unknown Spring Page fields are ignored on deserialization.
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PlaylistResponse'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        number:
          type: integer
          description: Current page number (0-based)
        size:
          type: integer

    CreateSongRequest:
      type: object
      required: [artist, name]
      properties:
        artist:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        album:
          type: string
        releaseYear:
          type: integer

    UpdateSongRequest:
      type: object
      required: [artist, name]
      properties:
        artist:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        album:
          type: string
        releaseYear:
          type: integer

    SongResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        artist:
          type: string
        name:
          type: string
        album:
          type: string
        releaseYear:
          type: integer
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SongPage:
      type: object
      description: Spring Page response for songs. Unknown Spring Page fields are ignored on deserialization.
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/SongResponse'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        number:
          type: integer
          description: Current page number (0-based)
        size:
          type: integer

    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          additionalProperties:
            type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
