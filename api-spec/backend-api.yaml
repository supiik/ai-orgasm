openapi: 3.0.3
info:
  title: Orgasm Backend API
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: contributors
  - name: playlists
  - name: nominations
  - name: songs
  - name: health
  - name: organizations
  - name: registration

paths:
  /api/v1/contributors:
    get:
      tags: [contributors]
      operationId: findAllContributors
      summary: List contributors (paginated)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          schema:
            type: string
            default: id
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Filter by name (case-insensitive contains)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContributorPage'
    post:
      tags: [contributors]
      operationId: createContributor
      summary: Create a contributor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContributorRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContributorResponse'
        '400':
          description: Validation error

  /api/v1/contributors/me:
    get:
      tags: [contributors]
      operationId: findCurrentContributor
      summary: Get the contributor matching the authenticated user's email
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContributorResponse'
        '404':
          description: No contributor matches the current user's email

  /api/v1/contributors/{id}:
    get:
      tags: [contributors]
      operationId: findContributorById
      summary: Get a contributor by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContributorResponse'
        '404':
          description: Not found
    put:
      tags: [contributors]
      operationId: updateContributor
      summary: Update a contributor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContributorRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContributorResponse'
        '400':
          description: Validation error
        '404':
          description: Not found
    delete:
      tags: [contributors]
      operationId: deleteContributor
      summary: Delete a contributor (soft delete)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No content
        '404':
          description: Not found

  /api/v1/songs:
    get:
      tags: [songs]
      operationId: findAllSongs
      summary: List songs (paginated)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          schema:
            type: string
            default: id
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Filter by name (case-insensitive contains)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SongPage'
    post:
      tags: [songs]
      operationId: createSong
      summary: Create a song
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSongRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SongResponse'
        '400':
          description: Validation error

  /api/v1/songs/{id}:
    get:
      tags: [songs]
      operationId: findSongById
      summary: Get a song by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SongResponse'
        '404':
          description: Not found
    put:
      tags: [songs]
      operationId: updateSong
      summary: Update a song
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSongRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SongResponse'
        '400':
          description: Validation error
        '404':
          description: Not found
    delete:
      tags: [songs]
      operationId: deleteSong
      summary: Delete a song (soft delete)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No content
        '404':
          description: Not found

  /api/health:
    get:
      tags: [health]
      operationId: health
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/playlists:
    get:
      tags: [playlists]
      operationId: findAllPlaylists
      summary: List playlists (paginated)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          schema:
            type: string
            default: id
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Filter by name (case-insensitive contains)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistPage'
    post:
      tags: [playlists]
      operationId: createPlaylist
      summary: Create a playlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlaylistRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistResponse'
        '400':
          description: Validation error

  /api/v1/playlists/{id}/open:
    post:
      tags: [playlists]
      operationId: openPlaylist
      summary: Open a playlist for nominations
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenPlaylistRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistResponse'
        '404':
          description: Not found
        '409':
          description: Conflict

  /api/v1/playlists/{id}/start-guessing:
    post:
      tags: [playlists]
      operationId: startGuessing
      summary: Close nominations and move playlist to guessing phase
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartGuessingRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistResponse'
        '404':
          description: Not found
        '409':
          description: Conflict

  /api/v1/playlists/{id}/submit-guesses:
    post:
      tags: [playlists]
      operationId: submitGuesses
      summary: Record that a contributor has submitted their guesses for a playlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitGuessesRequest'
      responses:
        '204':
          description: No content
        '404':
          description: Not found
        '409':
          description: Conflict

  /api/v1/playlists/{id}/publish:
    post:
      tags: [playlists]
      operationId: publishPlaylist
      summary: Publish a playlist after deadline
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishPlaylistRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistResponse'
        '404':
          description: Not found
        '409':
          description: Conflict

  /api/v1/playlists/{id}/nominations:
    post:
      tags: [nominations]
      operationId: nominateSong
      summary: Nominate a song to a playlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NominateSongRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NominationResponse'
        '404':
          description: Not found
        '409':
          description: Conflict
    get:
      tags: [nominations]
      operationId: findNominations
      summary: List nominations for a playlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NominationPage'

  /api/v1/nominations/{id}/approve:
    put:
      tags: [nominations]
      operationId: approveNomination
      summary: Approve a nomination
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewNominationRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NominationResponse'
        '404':
          description: Not found
        '409':
          description: Conflict

  /api/v1/nominations/{id}/decline:
    put:
      tags: [nominations]
      operationId: declineNomination
      summary: Decline a nomination
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewNominationRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NominationResponse'
        '404':
          description: Not found
        '409':
          description: Conflict

  /api/v1/contributors/{id}/playlists:
    get:
      tags: [contributors]
      operationId: findPlaylistsByContributor
      summary: List playlists led by a contributor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistPage'

  /api/v1/playlists/{id}:
    get:
      tags: [playlists]
      operationId: findPlaylistById
      summary: Get a playlist by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistResponse'
        '404':
          description: Not found
    put:
      tags: [playlists]
      operationId: updatePlaylist
      summary: Update a playlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlaylistRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistResponse'
        '400':
          description: Validation error
        '404':
          description: Not found
    delete:
      tags: [playlists]
      operationId: deletePlaylist
      summary: Delete a playlist (soft delete)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No content
        '404':
          description: Not found

  /api/v1/organizations:
    get:
      tags: [organizations]
      operationId: findAllOrganizations
      summary: List organizations (public, for registration)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationResponse'

  /api/v1/register:
    post:
      tags: [registration]
      operationId: register
      summary: Register a new contributor for an organization (public)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema:
                type: string
              description: URL of the created contributor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContributorResponse'
        '400':
          description: Validation error
        '404':
          description: Organization not found

components:
  schemas:
    CreateContributorRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
        avatarUrl:
          type: string

    UpdateContributorRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
        avatarUrl:
          type: string

    ContributorResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        avatarUrl:
          type: string
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ContributorPage:
      type: object
      description: Spring Page response for contributors. Unknown Spring Page fields are ignored on deserialization.
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ContributorResponse'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        number:
          type: integer
          description: Current page number (0-based)
        size:
          type: integer

    PlaylistStatus:
      type: string
      enum: [NEW, OPEN, GUESSING, UNDER_EVALUATION, CLOSED, PUBLISHED]

    NominationStatus:
      type: string
      enum: [PENDING, APPROVED, DECLINED]

    OpenPlaylistRequest:
      type: object
      required: [contributorId, deadline]
      properties:
        contributorId:
          type: string
        deadline:
          type: string
          format: date-time

    StartGuessingRequest:
      type: object
      required: [contributorId]
      properties:
        contributorId:
          type: string

    PublishPlaylistRequest:
      type: object
      required: [contributorId]
      properties:
        contributorId:
          type: string

    SubmitGuessesRequest:
      type: object
      required: [contributorId, guesses]
      properties:
        contributorId:
          type: string
        guesses:
          type: array
          items:
            $ref: '#/components/schemas/GuessItem'

    GuessItem:
      type: object
      required: [nominationId, guessedContributorId]
      properties:
        nominationId:
          type: string
        guessedContributorId:
          type: string

    NominateSongRequest:
      type: object
      required: [contributorId, songId]
      properties:
        contributorId:
          type: string
        songId:
          type: string

    ReviewNominationRequest:
      type: object
      required: [reviewerId]
      properties:
        reviewerId:
          type: string

    NominationResponse:
      type: object
      properties:
        id:
          type: string
        playlistId:
          type: string
        songId:
          type: string
        nominatedById:
          type: string
        status:
          $ref: '#/components/schemas/NominationStatus'
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    NominationPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/NominationResponse'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        number:
          type: integer
        size:
          type: integer

    CreatePlaylistRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        status:
          $ref: '#/components/schemas/PlaylistStatus'

    UpdatePlaylistRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        status:
          $ref: '#/components/schemas/PlaylistStatus'

    PlaylistResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/PlaylistStatus'
        leadContributorId:
          type: string
          nullable: true
        deadline:
          type: string
          format: date-time
          nullable: true
        guessingDeadline:
          type: string
          format: date-time
          nullable: true
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PlaylistPage:
      type: object
      description: Spring Page response for playlists. Unknown Spring Page fields are ignored on deserialization.
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PlaylistResponse'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        number:
          type: integer
          description: Current page number (0-based)
        size:
          type: integer

    CreateSongRequest:
      type: object
      required: [artist, name]
      properties:
        artist:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        album:
          type: string
        releaseYear:
          type: integer
        url:
          type: string

    UpdateSongRequest:
      type: object
      required: [artist, name]
      properties:
        artist:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        album:
          type: string
        releaseYear:
          type: integer
        url:
          type: string

    SongResponse:
      type: object
      properties:
        id:
          type: string
        artist:
          type: string
        name:
          type: string
        album:
          type: string
        releaseYear:
          type: integer
        url:
          type: string
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SongPage:
      type: object
      description: Spring Page response for songs. Unknown Spring Page fields are ignored on deserialization.
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/SongResponse'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        number:
          type: integer
          description: Current page number (0-based)
        size:
          type: integer

    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          additionalProperties:
            type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time

    OrganizationResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        name:
          type: string

    RegisterRequest:
      type: object
      required: [name, organizationSlug]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
        avatarUrl:
          type: string
        organizationSlug:
          type: string
          minLength: 1
