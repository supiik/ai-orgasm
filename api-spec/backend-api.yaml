openapi: 3.0.3
info:
  title: Orgasm Backend API
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: playlists
  - name: health

paths:
  /api/health:
    get:
      tags: [health]
      operationId: health
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/playlists:
    get:
      tags: [playlists]
      operationId: findAllPlaylists
      summary: List playlists (paginated)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          schema:
            type: string
            default: id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistPage'
    post:
      tags: [playlists]
      operationId: createPlaylist
      summary: Create a playlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Playlist'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'

  /api/playlists/{id}:
    get:
      tags: [playlists]
      operationId: findPlaylistById
      summary: Get a playlist by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '404':
          description: Not found
    put:
      tags: [playlists]
      operationId: updatePlaylist
      summary: Update a playlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Playlist'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
    delete:
      tags: [playlists]
      operationId: deletePlaylist
      summary: Delete a playlist (soft delete)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: No content

components:
  schemas:
    Playlist:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
        description:
          type: string
        version:
          type: integer
          format: int64
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    PlaylistPage:
      type: object
      description: Spring Page response for playlists. Unknown Spring Page fields are ignored on deserialization.
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Playlist'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        number:
          type: integer
          description: Current page number (0-based)
        size:
          type: integer

    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          additionalProperties:
            type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
