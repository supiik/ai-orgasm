openapi: 3.0.3
info:
  title: Anchor Backend API
  description: REST API for the Anchor base project
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: samples
    description: Sample entity CRUD — covers all field types for UI testing
  - name: health
    description: Health and readiness probes

paths:
  /health:
    get:
      tags: [health]
      summary: Health check
      operationId: health
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/samples:
    get:
      tags: [samples]
      summary: List samples (paginated)
      operationId: findAllSamples
      parameters:
        - name: name
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/SampleStatus'
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated list of samples
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SamplePage'

    post:
      tags: [samples]
      summary: Create a new sample
      operationId: createSample
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSampleRequest'
      responses:
        "201":
          description: Sample created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SampleResponse'
        "400":
          description: Validation error

  /api/v1/samples/{id}:
    get:
      tags: [samples]
      summary: Get a sample by ID
      operationId: getSample
      parameters:
        - $ref: '#/components/parameters/SampleId'
      responses:
        "200":
          description: Sample found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SampleResponse'
        "404":
          description: Not found

    put:
      tags: [samples]
      summary: Update a sample
      operationId: updateSample
      parameters:
        - $ref: '#/components/parameters/SampleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSampleRequest'
      responses:
        "200":
          description: Sample updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SampleResponse'
        "400":
          description: Validation error
        "404":
          description: Not found

    delete:
      tags: [samples]
      summary: Soft-delete a sample
      operationId: deleteSample
      parameters:
        - $ref: '#/components/parameters/SampleId'
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

components:
  parameters:
    SampleId:
      name: id
      in: path
      required: true
      schema:
        type: string
      example: smpl-0001

  schemas:
    SampleStatus:
      type: string
      enum: [DRAFT, ACTIVE, ARCHIVED]

    SampleResponse:
      type: object
      properties:
        id:
          type: string
          example: smpl-0001
        name:
          type: string
        description:
          type: string
        email:
          type: string
          format: email
        quantity:
          type: integer
          format: int32
        largeNumber:
          type: integer
          format: int64
        rating:
          type: number
          format: double
        price:
          type: number
        active:
          type: boolean
        birthDate:
          type: string
          format: date
        scheduledAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/SampleStatus'
        notes:
          type: string
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateSampleRequest:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        email:
          type: string
          format: email
        quantity:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
          default: 0
        largeNumber:
          type: integer
          format: int64
          default: 0
        rating:
          type: number
          format: double
          minimum: 0
          maximum: 10
          default: 0
        price:
          type: number
        active:
          type: boolean
          default: true
        birthDate:
          type: string
          format: date
        scheduledAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/SampleStatus'
        notes:
          type: string

    UpdateSampleRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        email:
          type: string
          format: email
        quantity:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
        largeNumber:
          type: integer
          format: int64
        rating:
          type: number
          format: double
          minimum: 0
          maximum: 10
        price:
          type: number
        active:
          type: boolean
        birthDate:
          type: string
          format: date
        scheduledAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/SampleStatus'
        notes:
          type: string

    SamplePage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/SampleResponse'
        page:
          $ref: '#/components/schemas/PageMetadata'

    PageMetadata:
      type: object
      properties:
        size:
          type: integer
        number:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: UP
